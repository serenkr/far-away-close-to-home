<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Far Away, Close to Home</title>
<meta name="description" content="나를 만든 40명의 사람을 실제 거리와 내가 느끼는 거리, 두 개의 지도로 그린 작업. A map of the people who made me, in measured and felt distance.">
<meta property="og:title" content="Far Away, Close to Home">
<meta property="og:description" content="실제의 거리와 마음의 거리로 그린 두 개의 지도 · Two maps, in measured and felt distance.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#EFE8D5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* Layout: an app shell around an antique atlas plate. Light = paper plate; dark = the same plate as a night sky where people become stars.
   Phone: bottom tabs + bottom sheet. Tablet: top tabs + floating card. Laptop: top tabs, plate + side card. */
:root{
  color-scheme:light;
  --desk:#D9D0BA; --paper:#EFE8D5; --paper-2:#E6DDC6; --ink:#2A2520; --ink-soft:#5E554A; --rule:#8C8270;
  --land:#CFC6B1; --hatch:#2A2520; --tint-1:#A9BCCF; --tint-2:#4D739D; --blue:#1F4A7A; --globe:#EFE8D5; --globe-op:1;
  --c-fam:#9C3A32; --c-fri:#2C6A5D; --c-men:#A8741C; --c-wrk:#5A4886; --c-adm:#7D756A;
  --star:#FFF6E0; --on-dot:#EFE8D5;
  --f-fell:"IM Fell English","Gowun Batang",Georgia,serif;
  --f-sc:"IM Fell English SC","Gowun Batang",Georgia,serif;
  --f-ko:"Gowun Batang","IM Fell English",serif;
  --peek:0px;
}
html.dark{
  color-scheme:dark;
  --desk:#04060D; --paper:#0A0F22; --paper-2:#0D1430; --ink:#ECE6D6; --ink-soft:#9AA3BC; --rule:#2B3560;
  --land:#101834; --hatch:#3A4A80; --tint-1:#2B4B8F; --tint-2:#6A5BC9; --blue:#A9C4FF; --globe:#0C1330; --globe-op:.55;
  --c-fam:#FF9F8C; --c-fri:#7FE7CB; --c-men:#FFD47A; --c-wrk:#C9B6FF; --c-adm:#AEB6C9;
  --on-dot:#0A0F22;
}
html[lang="en"]{--f-ko:"IM Fell English","Gowun Batang",Georgia,serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ko);font-size:15px;line-height:1.65;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

.appbar{display:flex;align-items:center;gap:10px 20px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;margin-right:auto}
.brand b{font-family:var(--f-sc);font-weight:400;letter-spacing:.1em;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12px;color:var(--ink-soft)}
.prefs{display:flex;align-items:center;gap:8px;flex:none}
.lang{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px}
.lang button{border:0;background:none;cursor:pointer;padding:4px 9px;border-radius:999px;font-size:12.5px;color:var(--ink-soft);line-height:1.2}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.themebtn{width:34px;height:30px;border:1px solid var(--rule);border-radius:999px;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.themebtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}
.toptabs{display:none;gap:2px}
.toptabs button,.tabbar button{background:none;border:0;cursor:pointer}
.toptabs button{padding:8px 12px;font-size:14.5px;color:var(--ink-soft);border-bottom:2px solid transparent;white-space:nowrap}
.toptabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--rule)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;font-size:11px;color:var(--ink-soft);min-height:52px;line-height:1.2;text-align:center}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4}
.tabbar button[aria-current="page"]{color:var(--blue)}
@media (min-width:768px){.toptabs{display:flex}.tabbar{display:none}}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.page{max-width:1080px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:24px}
@media (min-width:768px){.page{padding:36px 28px 64px}}
.sheet{background:var(--paper);padding:24px 22px;box-shadow:0 10px 30px -18px rgba(60,45,20,.45);min-width:0}
html.dark .sheet{box-shadow:0 0 0 1px var(--rule),0 20px 50px -20px rgba(0,0,0,.8)}
@media (min-width:768px){.sheet{padding:32px 36px}}
h2{font-family:var(--f-ko);font-weight:700;font-size:22px;letter-spacing:.04em;margin:0 0 8px;text-wrap:balance}
.sub{color:var(--ink-soft);margin:0 0 14px;font-size:14px;max-width:62ch}
.eh{font-family:var(--f-sc);letter-spacing:.2em;font-size:13px;color:var(--ink-soft);margin:0}

.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:8px 0 4px}
.cover .k1{font-size:15px;letter-spacing:.25em;margin:0}
html[lang="en"] .cover .k1{letter-spacing:.08em;font-style:italic}
.cover h1{margin:0;font-family:var(--f-ko);font-weight:700;font-size:clamp(28px,6vw,48px);letter-spacing:.14em;line-height:1.25;text-wrap:balance}
html[lang="en"] .cover h1{letter-spacing:.02em;font-weight:400}
.cover .k2{font-family:var(--f-sc);letter-spacing:.28em;color:var(--ink-soft);font-size:14px;margin:0}
.intro{display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:860px){.intro{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:28px 52px}}
.epi{margin:0;border-top:3px double var(--ink);border-bottom:1px solid var(--rule);padding:18px 0 16px}
.epi p{margin:0;font-size:18px;line-height:1.85;text-wrap:pretty}
.epi cite{display:block;margin-top:12px;font-style:normal;font-size:13px;color:var(--ink-soft);text-align:right}
.essay{display:flex;flex-direction:column;gap:12px;max-width:62ch}
.essay p{margin:0;font-size:15.5px;line-height:1.9}
html[lang="en"] .essay p{font-size:17px;line-height:1.7}
.essay .last{font-weight:700;font-size:17px;border-left:2px solid var(--blue);padding-left:14px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;font-size:15px;border-radius:2px}
.btn.ghost{background:transparent;color:var(--ink)}

#v-map{display:flex;flex-direction:column;overflow:hidden}
.tools{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--paper-2);border-bottom:1px solid var(--rule)}
.row{display:flex;align-items:center;gap:6px;min-width:0}
.row.scroll{overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row.scroll::-webkit-scrollbar{display:none}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;padding:2px;flex:none}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip{flex:none;font-size:13px;line-height:1;background:var(--paper);border:1px solid var(--rule);padding:8px 10px;cursor:pointer;border-radius:2px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lab{flex:none;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.sep{flex:none;width:1px;height:22px;background:var(--rule);margin:0 4px}
.yr{flex:1 1 140px;min-width:100px;accent-color:var(--blue)}
.yrout{font-family:var(--f-fell);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ho{font-size:12.5px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mapwrap{flex:1;min-height:0;display:flex;position:relative}
.stage{flex:1;min-width:0;overflow:auto;background:var(--desk);padding-bottom:var(--peek)}
.stage svg{display:block;background:var(--paper)}
.stage.fit svg{width:100%;height:100%}
.stage.flow svg{width:100%;height:auto}

.card{background:var(--paper);border-left:1px solid var(--rule);width:360px;flex:none;overflow:auto;display:flex;flex-direction:column}
.card-in{padding:20px 22px 16px;display:flex;flex-direction:column;gap:14px}
.grab{display:none}
.no{font-family:var(--f-sc);letter-spacing:.12em;font-size:13px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:8px}
.no i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.nm{font-family:var(--f-fell);font-size:42px;line-height:1;margin:0;letter-spacing:.02em}
.rl{margin:4px 0 0;font-size:14px;color:var(--ink-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0}
.two div{padding:8px 0;min-width:0}
.two div+div{border-left:1px solid var(--rule);padding-left:14px}
.two dt{font-size:12.5px;color:var(--ink-soft)}
.two dd{margin:0;font-family:var(--f-fell);font-size:26px;line-height:1.2;white-space:nowrap}
.two dd small{font-size:14px;color:var(--ink-soft)}
.two .ct{font-size:12.5px;color:var(--ink-soft)}
.why{margin:0;font-size:16px;line-height:1.75;text-wrap:pretty}
.why::before{content:"“";font-family:var(--f-fell);color:var(--blue)}
.why::after{content:"”";font-family:var(--f-fell);color:var(--blue)}
.met{margin:0;font-size:13px;color:var(--ink-soft)}
.nav{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--rule);padding-top:8px;gap:8px}
.nav button{background:none;border:0;cursor:pointer;padding:8px 4px;font-size:14px}
.nav span{font-family:var(--f-fell);font-size:13px;color:var(--ink-soft)}
.how{font-size:12.5px;color:var(--ink-soft);margin:0;border-top:1px dashed var(--rule);padding-top:10px}
.more{display:flex;flex-direction:column;gap:12px}
.peekline{display:none;align-items:baseline;gap:10px;flex-wrap:wrap}
.peekline b{font-family:var(--f-fell);font-weight:400;font-size:26px;line-height:1}
.peekline span{font-size:13px;color:var(--ink-soft)}
.peekline em{font-style:normal;font-family:var(--f-fell);font-size:16px;color:var(--blue);margin-left:auto}
@media (max-width:1099px){
  .card{position:absolute;left:0;right:0;bottom:0;width:auto;border-left:0;border-top:1px solid var(--rule);box-shadow:0 -12px 28px -16px rgba(40,30,15,.5);max-height:72%;z-index:5;border-radius:12px 12px 0 0}
  .grab{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;background:none;border:0;padding:8px 0 0;cursor:pointer;font-size:12px;color:var(--ink-soft)}
  .grab::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--rule)}
  .card-in{padding:8px 18px 14px;gap:10px}
  .card.closed .more,.card.closed .full{display:none}
  .card:not(.closed) .peekline{display:none}
  .card.closed .peekline{display:flex}
  .nm{font-size:32px}
  .two dd{font-size:22px}
}
@media (max-width:1099px) and (min-width:768px){.card{left:auto;right:16px;bottom:16px;width:380px;border-radius:10px;border:1px solid var(--rule)}}

/* plate text */
.t-sup{font-family:var(--f-ko);font-size:21px;letter-spacing:.22em;fill:var(--ink);text-anchor:middle}
.t-main{font-family:var(--f-ko);font-weight:700;font-size:44px;letter-spacing:.18em;fill:var(--ink);text-anchor:middle}
html[lang="en"] .t-sup{letter-spacing:.06em;font-style:italic}
html[lang="en"] .t-main{letter-spacing:.04em;font-weight:400;font-size:48px}
.t-en{font-family:var(--f-sc);font-size:19px;letter-spacing:.28em;fill:var(--ink-soft);text-anchor:middle}
.edge{font-family:var(--f-fell);font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.ringlab{font-family:var(--f-fell);font-style:italic;font-size:13.5px;fill:var(--ink-soft)}
.geo-lab{font-family:var(--f-ko);font-size:17px;letter-spacing:.55em;fill:var(--ink);opacity:.62;text-anchor:middle}
html[lang="en"] .geo-lab{letter-spacing:.1em;font-family:var(--f-sc)}
.geo-sm{font-family:var(--f-ko);font-size:12.5px;letter-spacing:.25em;fill:var(--ink-soft);text-anchor:middle;font-style:italic}
html[lang="en"] .geo-sm{letter-spacing:.05em;font-size:13.5px}
.arc-txt{font-family:var(--f-ko);font-size:15px;letter-spacing:.32em;fill:var(--ink-soft)}
html[lang="en"] .arc-txt{letter-spacing:.08em;font-style:italic}
.leg{font-family:var(--f-ko);font-size:17px;fill:var(--ink)}
.leg-sm{font-family:var(--f-ko);font-size:14px;fill:var(--ink-soft)}
.leg-cat{font-family:var(--f-ko);font-size:16px;fill:var(--ink)}
svg.wide .leg-sm,svg.wide .leg,svg.wide .leg-cat{font-size:24px}
.globe-bg{fill:var(--globe);fill-opacity:var(--globe-op)}
.hatch-line{stroke:var(--hatch)}
.land{stroke:var(--ink)}
html.dark .land{stroke:#3B4C86;stroke-width:.6}
.grain{display:inline}
html.dark .grain{display:none}

/* people: paper dots (light) / stars (dark) */
.node{cursor:pointer}
.node circle.d{stroke:var(--paper);stroke-width:1.6}
.node.adm circle.d{fill:var(--paper)!important;stroke:var(--c-adm);stroke-width:1.8}
.node text.ini{font-family:var(--f-fell);font-size:9.5px;fill:var(--on-dot);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.adm text.ini{fill:var(--c-adm)}
.node .h{fill:none;stroke:var(--ink);stroke-width:2.2;opacity:0}
.node.sel .h{opacity:1}.node.hov .h{opacity:.55}
.node:focus{outline:none}.node:focus-visible .h{opacity:1;stroke-dasharray:3 2}
.node.future{opacity:.13}.node.future.sel,.node.future.hov{opacity:.6}
.node .glow,.node .core,.node .name,.node .hit{display:none}
html.dark .node circle.d,html.dark .node text.ini{display:none}
html.dark .node .glow{display:inline;filter:url(#glow);opacity:.85}
html.dark .node .core{display:inline;fill:#FFFDF6}
html.dark .node .hit{display:inline;fill:transparent}
html.dark .node .name{display:inline;font-family:var(--f-fell);font-size:10.5px;fill:var(--ink-soft);opacity:0;pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:3px}
html.dark .node.sel .name,html.dark .node.hov .name{opacity:1;fill:var(--ink)}
html.dark .node .h{stroke:var(--star);stroke-width:1;stroke-dasharray:2 3}
html.dark .node.adm .core{fill:none;stroke:#FFFDF6;stroke-width:1}
.me-core{fill:var(--ink)}
.me-ring{fill:none;stroke:var(--ink);stroke-width:.8}
.me-text{fill:var(--paper);font-family:var(--f-ko);font-weight:700;font-size:14px;text-anchor:middle;dominant-baseline:central}
html[lang="en"] .me-text{font-family:var(--f-fell);font-weight:400;font-size:13px}
.me-glow{display:none}
html.dark .me-glow{display:inline;fill:#FFE9B8;filter:url(#glow-big);opacity:.75}
html.dark .me-core{fill:#FFF6DE}
html.dark .me-ring{stroke:#FFE9B8;stroke-dasharray:1 3}
html.dark .me-text{fill:#0A0F22}
.sky{display:none}
html.dark .sky{display:inline}
.star{fill:var(--star)}
@media (prefers-reduced-motion:no-preference){
  html.dark .star.tw{animation:twinkle 3.6s ease-in-out infinite}
  html.dark .star.tw2{animation:twinkle 5.2s ease-in-out infinite 1.3s}
}
@keyframes twinkle{0%,100%{opacity:.95}50%{opacity:.2}}
.lead{stroke:var(--ink);stroke-width:.7;opacity:.55}
html.dark .lead{stroke:var(--blue);opacity:.35}
.pin{fill:var(--ink)}
html.dark .pin{fill:var(--blue);opacity:.7}
.thread{fill:none;stroke:var(--blue);stroke-width:1.6;stroke-dasharray:6 5}
.meas{font-family:var(--f-fell);font-style:italic;font-size:17px;fill:var(--blue);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.track-ghost{fill:none;stroke:var(--blue);stroke-width:1.2;stroke-dasharray:2 3;opacity:.35}
.track{fill:none;stroke:var(--blue);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.track-dot{fill:var(--paper);stroke:var(--blue);stroke-width:1.4}
.home-halo{fill:none;stroke:var(--blue);stroke-width:1.2;stroke-dasharray:3 3}
.home-glyph{fill:var(--blue);stroke:var(--paper);stroke-width:1.5}
.home-lab{font-family:var(--f-ko);font-weight:700;font-size:16px;fill:var(--blue);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.globe.zoomed{cursor:grab}

.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;min-width:0;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:2px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-basis:100%}
.chips .chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;border-top:1px solid var(--rule)}
@media (min-width:860px){.plist{grid-template-columns:1fr 1fr;column-gap:32px}}
.plist li{border-bottom:1px solid var(--rule)}
.prow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 2px;cursor:pointer}
.prow:hover{background:var(--paper-2)}
.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-fell);font-size:11.5px;color:var(--on-dot)}
html.dark .badge{box-shadow:0 0 12px 1px currentColor}
.badge.adm{background:var(--paper)!important;border:1.5px solid var(--c-adm);color:var(--c-adm)}
.pmain{min-width:0}
.pmain b{font-family:var(--f-fell);font-weight:400;font-size:18px;margin-right:6px}
.pmain span{font-size:13px;color:var(--ink-soft)}
.pmain .city{display:block;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnum{text-align:right;font-family:var(--f-fell);font-size:14px;line-height:1.3;white-space:nowrap}
.pnum em{display:block;font-style:normal;color:var(--ink-soft);font-size:12.5px}
.pcount{font-size:13px;color:var(--ink-soft);margin:0}

.home-grid{display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:860px){.home-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px 48px}}
.coord{margin:4px 0 0;font-family:var(--f-fell);font-size:clamp(34px,7vw,54px);line-height:1.05;color:var(--blue)}
.place{margin:0 0 10px;font-size:16px}
#hc-chart{display:block;width:100%;height:auto}
.hc-ghost{fill:none;stroke:var(--blue);stroke-width:1;stroke-dasharray:2 3;opacity:.4}
.hc-line{fill:none;stroke:var(--blue);stroke-width:2}
.hc-now{fill:var(--blue);stroke:var(--paper);stroke-width:2}
.cap{margin:0;font-size:12.5px;color:var(--ink-soft)}
.hc-text p{margin:0 0 12px;font-size:15px;line-height:1.85;max-width:62ch}
.hc-text .alt{color:var(--ink-soft);font-size:14px}
.hc-text .caveat{color:var(--ink-soft);font-size:13px;border-top:1px dashed var(--rule);padding-top:10px}

.about-grid{display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:960px){.about-grid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.plot{overflow-x:auto}
#scatter{display:block;width:100%;height:auto;min-width:480px}
.axis text{font-family:var(--f-fell);font-size:12px;fill:var(--ink-soft)}
.axis line,.axis path{stroke:var(--rule)}
.axt{font-family:var(--f-ko);font-size:12px;fill:var(--ink-soft)}
.zone{fill:var(--tint-1);opacity:.35}
.zonelab{font-family:var(--f-ko);font-size:12.5px;font-weight:700;fill:var(--blue)}
.sdot{cursor:pointer;stroke:var(--paper);stroke-width:1}
.sdot.adm{fill:var(--paper)!important;stroke:var(--c-adm);stroke-width:1.5}
.sdot.sel{stroke:var(--ink);stroke-width:2.2}
.slab{font-family:var(--f-fell);font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.facts{display:grid;grid-template-columns:1fr;border-top:1px solid var(--rule);margin-top:14px}
@media (min-width:600px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.facts div{padding:10px 10px 0 0}
.facts b{display:block;font-family:var(--f-fell);font-weight:400;font-size:28px;line-height:1.2}
.facts span{font-size:12.5px;color:var(--ink-soft);display:block;line-height:1.45}
.notes ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.notes li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;counter-increment:s}
.notes li::before{content:counter(s,upper-roman);font-family:var(--f-fell);font-size:15px;color:var(--blue)}
.notes li p{margin:2px 0 0;color:var(--ink-soft);font-size:14px}
.notes .tool{font-family:var(--f-sc);font-size:13px;letter-spacing:.08em;color:var(--blue)}
.principle{margin:16px 0 0;border-top:1px solid var(--rule);padding-top:14px;font-size:15.5px;line-height:1.75}
.foot{font-size:12.5px;color:var(--ink-soft);margin:0}
@media (min-width:768px) and (max-width:1023px){.brand b{font-size:13.5px;letter-spacing:.05em}.toptabs button{padding:8px 7px;font-size:13.5px}.appbar{gap:10px}}
@media (max-width:420px){.brand b{font-size:13px;letter-spacing:.06em}.lang button{padding:4px 7px}.appbar{gap:8px;padding:10px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="brand"><b>FAR AWAY, CLOSE TO HOME</b><span data-i18n="brand.sub"></span></div>
    <nav class="toptabs" aria-label="tabs">
      <button data-go="intro" data-i18n="tab.intro"></button><button data-go="map" data-i18n="tab.map"></button><button data-go="people" data-i18n="tab.people"></button><button data-go="home" data-i18n="tab.home"></button><button data-go="about" data-i18n="tab.about"></button>
    </nav>
    <div class="prefs">
      <div class="lang" role="group" data-i18n-aria="ui.lang"><button data-lang="ko" aria-pressed="true">한국어</button><button data-lang="en" aria-pressed="false">EN</button></div>
      <button class="themebtn" id="themeBtn"><svg viewBox="0 0 24 24" id="themeIcon"></svg></button>
    </div>
  </header>

  <main>
    <section class="view" id="v-intro">
      <div class="page">
        <div class="cover">
          <p class="k1" data-i18n="cover.k1"></p>
          <h1 data-i18n="cover.h1"></h1>
          <p class="k2">FAR AWAY, CLOSE TO HOME</p>
        </div>
        <div class="sheet intro">
          <blockquote class="epi"><p data-i18n="epi.q"></p><cite data-i18n="epi.cite"></cite></blockquote>
          <div class="essay">
            <p class="eh" data-i18n="essay.h"></p>
            <p data-i18n="essay.p1"></p>
            <p data-i18n="essay.p2"></p>
            <p class="last" data-i18n="essay.last"></p>
            <div class="cta"><button class="btn" data-go="map" data-i18n="cta.map"></button><button class="btn ghost" data-go="home" data-i18n="cta.home"></button></div>
          </div>
        </div>
      </div>
    </section>

    <section class="view" id="v-map" hidden>
      <div class="tools">
        <div class="row scroll">
          <div class="seg" role="group">
            <button data-crop="both" aria-pressed="true" data-i18n="tools.both"></button><button data-crop="g1" aria-pressed="false" data-i18n="tools.g1"></button><button data-crop="g2" aria-pressed="false" data-i18n="tools.g2"></button>
          </div>
          <span class="sep"></span>
          <span class="lab" data-i18n="tools.real"></span>
          <button class="chip" data-v="1:all" data-i18n="tools.all"></button><button class="chip" data-v="1:korea" data-i18n="tools.korea"></button><button class="chip" data-v="1:la" data-i18n="tools.la"></button><button class="chip" data-v="1:us" data-i18n="tools.us"></button>
          <button class="chip" data-v="1:in" aria-label="+">＋</button><button class="chip" data-v="1:out" aria-label="−">－</button>
          <span class="sep"></span>
          <span class="lab" data-i18n="tools.felt"></span>
          <button class="chip" data-v="2:all" data-i18n="tools.all"></button><button class="chip" data-v="2:near" data-i18n="tools.near"></button>
          <button class="chip" data-v="2:in" aria-label="+">＋</button><button class="chip" data-v="2:out" aria-label="−">－</button>
        </div>
        <div class="row">
          <span class="lab" data-i18n="tools.home"></span>
          <button class="chip" id="play" aria-pressed="false"></button>
          <input type="range" class="yr" id="yr" min="0" max="300" step="1" value="300" aria-label="year">
          <output class="yrout" id="yrOut"></output>
        </div>
        <div class="row"><span class="ho" id="homeOut"></span></div>
      </div>
      <div class="mapwrap">
        <div class="stage" id="stage"><svg id="plate" role="img" aria-label="Two maps"></svg></div>
        <aside class="card closed" id="cardBox" aria-live="polite">
          <button class="grab" id="grab" aria-expanded="false"><span id="grabTxt"></span></button>
          <div class="card-in">
            <div id="cardTop"></div>
            <div class="more">
              <div id="cardMore"></div>
              <div class="nav"><button id="prev" data-i18n="card.prev"></button><span id="pos"></span><button id="next" data-i18n="card.next"></button></div>
              <p class="how" data-i18n="card.how"></p>
            </div>
          </div>
        </aside>
      </div>
    </section>

    <section class="view" id="v-people" hidden>
      <div class="page">
        <div class="sheet">
          <h2 data-i18n="people.h"></h2>
          <p class="sub" data-i18n="people.sub"></p>
          <div class="ptools">
            <input class="search" id="q" type="search" data-i18n-ph="people.search">
            <div class="seg" role="group">
              <button data-sort="felt" aria-pressed="true" data-i18n="sort.felt"></button><button data-sort="km" aria-pressed="false" data-i18n="sort.km"></button><button data-sort="met" aria-pressed="false" data-i18n="sort.met"></button>
            </div>
            <div class="chips" id="chips"></div>
          </div>
          <p class="pcount" id="pcount"></p>
          <ul class="plist" id="plist"></ul>
        </div>
      </div>
    </section>

    <section class="view" id="v-home" hidden>
      <div class="page">
        <div class="sheet home-grid">
          <div>
            <p class="eh" data-i18n="home.eh"></p>
            <p class="coord" id="hc-coord"></p>
            <p class="place" id="hc-place"></p>
            <div style="border-top:1px solid var(--rule);padding-top:8px"><svg id="hc-chart" role="img" aria-label="chart"></svg></div>
            <p class="cap" data-i18n="home.cap"></p>
            <div class="cta" style="margin-top:14px"><button class="btn" id="playOnMap" data-i18n="home.play"></button></div>
          </div>
          <div class="hc-text">
            <h2 data-i18n="home.h"></h2>
            <p data-i18n="home.p1"></p>
            <p id="hc-p2"></p>
            <p data-i18n="home.p3"></p>
            <p class="alt" id="hc-alt"></p>
            <p class="caveat" data-i18n="home.caveat"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="view" id="v-about" hidden>
      <div class="page">
        <div class="about-grid">
          <div class="sheet">
            <h2 data-i18n="about.h1"></h2>
            <p class="sub" data-i18n="about.sub1"></p>
            <div class="plot" id="plotBox"><svg id="scatter" role="img" aria-label="scatter"></svg></div>
            <div class="facts" id="facts"></div>
          </div>
          <div class="sheet notes">
            <h2 data-i18n="about.h2"></h2>
            <p class="sub" data-i18n="about.sub2"></p>
            <ol>
              <li><div><b data-i18n="about.l1h"></b><p data-i18n="about.l1"></p></div></li>
              <li><div><b data-i18n="about.l2h"></b> · <span class="tool">ChatGPT</span><p data-i18n="about.l2"></p></div></li>
              <li><div><b data-i18n="about.l3h"></b> · <span class="tool">Claude · Figma</span><p data-i18n="about.l3"></p></div></li>
            </ol>
            <p class="principle" data-i18n="about.principle"></p>
          </div>
        </div>
        <p class="foot" data-i18n="foot"></p>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="tabs">
    <button data-go="intro"><svg viewBox="0 0 24 24"><path d="M4 5h7a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4z"/><path d="M20 5h-7a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h7z"/></svg><span data-i18n="tab.intro"></span></button>
    <button data-go="map"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="5"/><circle cx="12" cy="17.5" r="5"/><circle cx="12" cy="7" r="1.2"/><circle cx="12" cy="17.5" r="1.2"/></svg><span data-i18n="tab.map"></span></button>
    <button data-go="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.4 3-5 6-5s5.4 1.6 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 13.6c2.6-.3 4.6 1.2 5.3 4.4"/></svg><span data-i18n="tab.people"></span></button>
    <button data-go="home"><svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/><circle cx="12" cy="14" r="1.6"/></svg><span data-i18n="tab.home"></span></button>
    <button data-go="about"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg><span data-i18n="tab.about"></span></button>
  </nav>
</div>

en:{
 'brand.sub':'The people who made me, mapped','tab.intro':'Preface','tab.map':'Two Maps','tab.people':'People','tab.home':'Home','tab.about':'Process',

 'cover.k1':'measured in kilometres, and in feeling','cover.h1':'A Map of the People Who Made Me',
 'epi.q':'“That was life, that was experience; that was what adventurers set out for and what art had in mind: going to one’s family, coming home, taking up one’s existence again.”',
 'epi.cite':'Boris Pasternak, Doctor Zhivago (translated here from the Korean edition)','essay.h':'Preface',
 'essay.p1':'After seeing Do Ho Suh’s exhibition, I found myself asking again what home is to me, and what it means on its own terms. I can’t remember ever living in one place for long, not even as a child. Korean fortune-tellers have a name for a life like this, yeongmasal, the fate of the wandering horse. In English you might just call it wanderlust. Which left me wondering: where, then, is home?',
 'essay.p2':'Years of studying abroad, of being the outsider, the one passing through, turned home from a place into people. The people I meet and the communities I belong to are where I can finally relax. Home isn’t somewhere I have to go back to. It’s somewhere I get to be. So if I gave that home a shape, what would it look like? To find out, I took every place I had known, all the way back to my childhood photo albums, and turned them into coordinates.',

 'home.eh':'Where home is · October 2026','home.cap':'How far home sat from Seoul, year by year. Every new person pulled it a little further out to sea.','home.play':'Watch home drift →','home.h':'Home turned out to be at sea',
 'home.p1':'I pinned each person’s city on the globe and found the balance point between them, giving more pull to the people I feel closest to: 21 minus their felt distance, so 19 for my mom, dad and younger sibling, and 1 for a poet I have never met. Bring that point up to the surface and you have the coordinate of home.',

const t=(k,vars)=>{let s=(I18N[LANG][k]??I18N.ko[k]??k);if(vars)for(const [a,b] of Object.entries(vars))s=s.replace('{'+a+'}',b);return s;};

function hav(a,b,c,d){const R=6371,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t;const h=Math.sin(x/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
P.forEach(p=>p.km=hav(ME.lat,ME.lon,p.lat,p.lon));

const RAD=Math.PI/180;
const nodes=P.map(p=>({...p}));
nodes.forEach(n=>{const m=n.met.match(/(\d{4})\D+(\d{1,2})/);n.yr=+m[1]+(+m[2]-1)/12;});

/* ---------- home coordinate ---------- */
function homeAt(Y,wf=p=>21-p.f){let x=0,y=0,z=0,Wt=0,c=0;
  nodes.forEach(p=>{if(p.yr>Y+1e-6)return;c++;const w=wf(p),la=p.lat*RAD,lo=p.lon*RAD;x+=w*Math.cos(la)*Math.cos(lo);y+=w*Math.cos(la)*Math.sin(lo);z+=w*Math.sin(la);Wt+=w;});
  if(!c)return null;const lat=Math.atan2(z,Math.hypot(x,y))/RAD,lon=Math.atan2(y,x)/RAD;
  return{lat,lon,r:Math.hypot(x,y,z)/Wt,count:c,Y,km:hav(ME.lat,ME.lon,lat,lon)};}
const Y0=2001+9/12, MONTHS=25*12;
const TRACK=d3.range(MONTHS+1).map(i=>homeAt(Y0+i/12));
let curI=MONTHS;
const ym=Y=>{const y=Math.floor(Y+1e-6),m=Math.round((Y-y)*12)+1;return LANG==='en'?`${MON[m-1]} ${y}`:`${y}년 ${m}월`;};
const fmtLL=h=>`${Math.abs(h.lat).toFixed(1)}°${h.lat>=0?'N':'S'} ${Math.abs(h.lon).toFixed(1)}°${h.lon>=0?'E':'W'}`;
function placeName(h){const L=(h.lon+360)%360;let i;
  if(h.km<200)i=0;else if(L<131&&h.lat<43)i=h.lat>38.3?2:1;else if(L<143)i=3;else if(L<156)i=4;else if(L<164)i=5;else i=6;return t('pl.'+i);}

/* ---------- plate ---------- */
const svg=d3.select('#plate'), stageEl=document.getElementById('stage');

let drawTop, drawBot, gHomeParts;
let layoutName=null, crop='both', view1='all', view2='all', sel='P09', hov=null;
const R=430, CLIP=104, RN=10.5, RME=15;
const LAYOUTS={
  stacked:{W:1000,H:2090,g1:[500,652],g2:[500,1550],tx:500,skip1:180,skip2:0,caps:[[64,1057,'start','plate.cap1.stacked'],[936,1139,'end','plate.cap2.stacked']],tint:[[64,1101],[936,1101]],catY:2050},

};

const GRAT=d3.geoGraticule().step([15,15])();

const KM=[1000,2000,4000,6000,8000,10000];
const GLL=[[[178,22],'geo-lab'],[[-38,38],'geo-lab'],[[78,-12],'geo-lab'],[[20,84],'geo-lab'],[[92,52],'geo-sm'],[[18,54],'geo-sm'],[[-102,52],'geo-sm'],[[134,-24],'geo-sm'],[[22,8],'geo-sm'],[[150,0],'geo-sm'],[[-160,23.44],'geo-sm'],[[60,66.56],'geo-sm'],[[128.6,35.0],'geo-sm z'],[[138.5,36.5],'geo-sm z'],[[-119.6,36.6],'geo-sm z'],[[-120.3,33.9],'geo-sm z']];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}

function buildPlate(name){
  layoutName=name; L=LAYOUTS[name]; svg.classed('wide',name==='wide'); T1=d3.zoomIdentity; T2=d3.zoomIdentity; view1='all'; view2='all';
  const [X1,Y1]=L.g1, [X2,Y2]=L.g2;

  const defs=svg.append('defs');

  hatch.append('line').attr('class','hatch-line').attr('x1',0).attr('y1',0).attr('x2',0).attr('y2',5).attr('stroke-width',.7).attr('opacity',.45);

  gf.append('feColorMatrix').attr('values','0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .18  0 0 0 .09 0');

  defs.append('filter').attr('id','glow-big').attr('x','-150%').attr('y','-150%').attr('width','400%').attr('height','400%').append('feGaussianBlur').attr('stdDeviation',9);
  const milky=defs.append('radialGradient').attr('id','milky').attr('cx','50%').attr('cy','50%').attr('r','50%');

    .attr('transform',`rotate(${name==='wide'?-12:-62} ${L.W/2} ${L.H/2})`).attr('fill','url(#milky)');
  const r=rng(42), nStars=Math.round(L.W*L.H/3800);
  for(let i=0;i<nStars;i++){const big=r()<.06;sky.append('circle').attr('class','star'+(r()<.18?' tw':r()<.22?' tw2':'')).attr('cx',(r()*L.W).toFixed(1)).attr('cy',(r()*L.H).toFixed(1)).attr('r',(big?1.4+r()*1.2:.35+r()*.8).toFixed(2)).attr('opacity',(.35+r()*.6).toFixed(2));}
  svg.append('rect').attr('x',22).attr('y',22).attr('width',L.W-44).attr('height',L.H-44).attr('fill','none').attr('stroke','var(--ink)').attr('stroke-width',1.4).attr('opacity',.9);
  svg.append('rect').attr('x',30).attr('y',30).attr('width',L.W-60).attr('height',L.H-60).attr('fill','none').attr('stroke','var(--ink)').attr('stroke-width',.6).attr('opacity',.9);
  svg.append('text').attr('class','t-sup').attr('x',L.tx).attr('y',82).text(t('plate.sup'));
  svg.append('text').attr('class','t-main').attr('x',L.tx).attr('y',134).text(t('plate.main'));
  svg.append('text').attr('class','t-en').attr('x',L.tx).attr('y',166).text('FAR AWAY, CLOSE TO HOME');

  s0=R/(CLIP*Math.PI/180);
  const mk=()=>d3.geoAzimuthalEquidistant().rotate([-ME.lon,-ME.lat]).clipAngle(CLIP).precision(.2);
  projBase=mk().scale(s0).translate([X1,Y1]); proj=mk().scale(s0).translate([X1,Y1]); path=d3.geoPath(proj);

    .filter(e=>{const k=d3.zoomTransform(G.node()).k;
      if(e.type==='wheel')return e.ctrlKey||e.metaKey;
      if(e.type==='touchstart')return k>1.01;

    .on('zoom',e=>{render(e.transform);G.style('touch-action',e.transform.k>1.01?'none':'pan-y');G.classed('zoomed',e.transform.k>1.01);syncButtons();});
  G.call(z).on('dblclick.zoom',null).style('touch-action','pan-y');

function thread(id){

const REG={korea:[[124.6,38.9],[130.0,33.0]],la:[[-120.9,35.1],[-117.5,33.6]],us:[[-125,49.5],[-68,29]]};
function fitTop(key){
  if(!REG[key])return d3.zoomIdentity;
  const pts=[REG[key][0],REG[key][1],[REG[key][0][0],REG[key][1][1]],[REG[key][1][0],REG[key][0][1]]].map(c=>projBase(c));
  const x0=d3.min(pts,p=>p[0]),x1=d3.max(pts,p=>p[0]),y0=d3.min(pts,p=>p[1]),y1=d3.max(pts,p=>p[1]);
  const k=Math.min(80,1.35*R/Math.max(x1-x0,y1-y0));
  return d3.zoomIdentity.translate(L.g1[0]-k*(x0+x1)/2,L.g1[1]-k*(y0+y1)/2).scale(k);
}
function go(which,key){
  if(which===1){view1=key;if(crop==='g2'){crop='both';applyCrop();}G1.transition().duration(dur).call(Z1.transform,fitTop(key));}
  else{view2=key;if(crop==='g1'){crop='both';applyCrop();}const c=L.g2;const tr=key==='near'?d3.zoomIdentity.translate(c[0],c[1]).scale(R/fR(10.6)*.9).translate(-c[0],-c[1]):d3.zoomIdentity;G2.transition().duration(dur).call(Z2.transform,tr);}
}
function step(which,f){if(which===1)view1='';else view2='';(which===1?G1:G2).transition().duration(dur*.6).call((which===1?Z1:Z2).scaleBy,f);}

function startPlay(){

}
playBtn.addEventListener('click',startPlay);
document.getElementById('playOnMap').addEventListener('click',()=>{show('map');crop='both';applyCrop();curI=0;drawHome();applyYear();startPlay();});

const order=[...nodes].sort((a,b)=>a.f-b.f||a.id.localeCompare(b.id));
const cardBox=document.getElementById('cardBox'), grab=document.getElementById('grab');
function card(){
  const n=nodes.find(d=>d.id===sel);
  const ring=n.f<=5?t('card.r1'):n.f<=10?t('card.r2'):t('card.r3');
  document.getElementById('cardTop').innerHTML=`
   <div class="peekline"><b>${n.n}</b><span>${relOf(n)}</span><em>${n.km<1?t('plate.same'):kmTxt(n.km)+' km'} · ${n.f}/20</em></div>
   <div class="full"><div class="no"><span>No. ${n.id.slice(1)}</span><span><i style="background:${col(n.cat)}"></i>${catLabel(n.cat)}</span></div>
   <div style="margin-top:10px"><h2 class="nm">${n.n}</h2><p class="rl">${relOf(n)}</p></div>
   <dl class="two" style="margin-top:10px">
     <div><dt>${t('card.real')}</dt><dd>${kmTxt(n.km)} <small>km</small></dd><div class="ct">${cityOf(n)}</div></div>
     <div><dt>${t('card.felt')}</dt><dd>${n.f} <small>/ 20</small></dd><div class="ct">${ring}</div></div>
   </dl></div>`;
  document.getElementById('cardMore').innerHTML=`<p class="why">${whyOf(n)}</p><p class="met" style="margin-top:8px">${LANG==='en'?`Known since ${metOf(n)} · as of Oct 2026`:`처음 만난 때 ${metOf(n)} · 기준 시점 2026년 10월`}</p>`;
  const k=order.findIndex(d=>d.id===sel)+1;
  document.getElementById('pos').textContent=LANG==='en'?`${k} of 40 by closeness`:`가까운 순 ${k} / 40`;
  document.getElementById('grabTxt').textContent=cardBox.classList.contains('closed')?t('card.more'):t('card.less');
  requestAnimationFrame(setPeek);
}
function setPeek(){
  const sheet=getComputedStyle(cardBox).position==='absolute';
  document.documentElement.style.setProperty('--peek',sheet&&cardBox.classList.contains('closed')?cardBox.offsetHeight+'px':'0px');
}
grab.addEventListener('click',()=>{const open=cardBox.classList.toggle('closed')===false;grab.setAttribute('aria-expanded',open);document.getElementById('grabTxt').textContent=open?t('card.less'):t('card.more');setPeek();});
document.getElementById('prev').onclick=()=>{const k=order.findIndex(d=>d.id===sel);select(order[(k+39)%40].id);};
document.getElementById('next').onclick=()=>{const k=order.findIndex(d=>d.id===sel);select(order[(k+1)%40].id);};
function select(id){
  sel=id; nsAll().classed('sel',d=>d.n.id===id); nsAll().filter(d=>d.n.id===id).raise();
  thread(id); card(); sSel(); listSel();
}

let sortKey='felt', catFilter=null;
const chipsEl=document.getElementById('chips');
function renderChips(){
  chipsEl.innerHTML=`<button class="chip" data-cat="" aria-pressed="${!catFilter}">${t('people.all')} 40</button>`+Object.keys(CATS).map(k=>`<button class="chip" data-cat="${k}" aria-pressed="${catFilter===k}"><i style="background:${col(k)}"></i>${catLabel(k)} ${P.filter(p=>p.cat===k).length}</button>`).join('');
}
chipsEl.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;catFilter=b.dataset.cat||null;renderChips();renderList();});
document.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{sortKey=b.dataset.sort;document.querySelectorAll('[data-sort]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderList();}));
document.getElementById('q').addEventListener('input',renderList);
function renderList(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  let list=nodes.filter(n=>(!catFilter||n.cat===catFilter)&&(!q||(n.n+n.rel+n.city+n.why+EN[n.id].join(' ')+CITY_EN[n.cityKey]).toLowerCase().includes(q)));
  const by={felt:(a,b)=>a.f-b.f||a.km-b.km,km:(a,b)=>b.km-a.km,met:(a,b)=>a.yr-b.yr}[sortKey];
  list.sort(by);
  document.getElementById('pcount').textContent=LANG==='en'?`${list.length} people`:`${list.length}명`;
  document.getElementById('plist').innerHTML=list.map(n=>`<li><button class="prow" data-id="${n.id}" aria-current="${n.id===sel}">
    <span class="badge ${n.cat==='adm'?'adm':''}" style="background:${col(n.cat)};color:${n.cat==='adm'?'':'var(--on-dot)'}">${n.n}</span>
    <span class="pmain"><b>${n.n}</b><span>${relOf(n)}</span><span class="city">${cityOf(n)} · ${LANG==='en'?'since':'처음 만난 때'} ${metOf(n)}</span></span>
    <span class="pnum">${n.f} / 20<em>${n.km<1?t('sc.same'):kmTxt(n.km)+' km'}</em></span></button></li>`).join('');
}
document.getElementById('plist').addEventListener('click',e=>{const b=e.target.closest('.prow');if(!b)return;select(b.dataset.id);show('map');});
function listSel(){document.querySelectorAll('.prow').forEach(b=>b.setAttribute('aria-current',b.dataset.id===sel));}

function homeSheet(){
  const h=TRACK[MONTHS];
  document.getElementById('hc-coord').textContent=fmtLL(h);
  document.getElementById('hc-place').textContent=LANG==='en'?`Out in ${placeName(h)}, ${nf(Math.round(h.km))} km from Seoul`:`${placeName(h)} · 서울에서 ${nf(Math.round(h.km))} km`;
  document.getElementById('hc-p2').innerHTML=t('home.p2',{d:nf(Math.round(6371*(1-h.r)))+' km'});
  const inv=homeAt(Y0+MONTHS/12,p=>1/p.f), eq=homeAt(Y0+MONTHS/12,()=>1);
  document.getElementById('hc-alt').textContent=LANG==='en'
    ?`Change the weighting and home moves, but not far. Weight by 1/distance and it lands ${placeName(inv)} (${fmtLL(inv)}); weight everyone equally and it sits in the eastern part of ${placeName(eq)} (${fmtLL(eq)}). Either way, it stays out on the North Pacific, between Korea and the US.`
    :`가중치를 1/거리로 바꾸면 ${placeName(inv)}(${fmtLL(inv)}), 모두 같은 무게로 두면 ${placeName(eq)} 동쪽(${fmtLL(eq)})이 된다. 방법을 바꿔도 집은 한국과 미국 사이, 북태평양 위에 머문다.`;
}
function drawHomeChart(){
  const el=d3.select('#hc-chart'),box=document.getElementById('hc-chart').parentNode.clientWidth;
  if(!box)return;
  const w=Math.max(280,box),h=170,m={l:50,r:14,t:14,b:26};
  el.attr('viewBox',`0 0 ${w} ${h}`);
  const x=d3.scaleLinear().domain([Y0,Y0+MONTHS/12]).range([m.l,w-m.r]);
  const top=Math.ceil(d3.max(TRACK,d=>d.km)/1000)*1000, y=d3.scaleLinear().domain([0,top]).range([h-m.b,m.t]);
  if(el.select('g.ax').empty()){el.append('g').attr('class','axis ax');el.append('g').attr('class','axis ay');el.append('path').attr('class','hc-ghost');el.append('path').attr('class','hc-line');el.append('circle').attr('class','hc-now').attr('r',4);}
  el.select('g.ax').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(x).tickValues(w<420?[2005,2015,2025]:[2005,2010,2015,2020,2025]).tickFormat(d3.format('d')).tickSizeOuter(0));
  el.select('g.ay').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(3).tickFormat(v=>v?d3.format(',')(v):(LANG==='en'?'Seoul':'서울')).tickSizeOuter(0));
  const ln=d3.line().x((d,i)=>x(Y0+i/12)).y(d=>y(d.km)).curve(d3.curveStepAfter);
  el.select('.hc-ghost').attr('d',ln(TRACK)); el.select('.hc-line').attr('d',ln(TRACK.slice(0,curI+1)));
  el.select('.hc-now').attr('cx',x(Y0+curI/12)).attr('cy',y(TRACK[curI].km));
}

const ss=d3.select('#scatter');let sx,sy;
function scatter(){
  const bw=document.getElementById('plotBox').clientWidth; if(!bw)return;
  const w=Math.max(480,bw),h=320,m={l:62,r:14,t:14,b:44};
  ss.attr('viewBox',`0 0 ${w} ${h}`);ss.selectAll('*').remove();
  sx=d3.scaleLog().domain([1,12000]).range([m.l,w-m.r]).clamp(true);sy=d3.scaleLinear().domain([1,20]).range([m.t+6,h-m.b-6]);
  ss.append('rect').attr('class','zone').attr('x',sx(5000)).attr('y',sy(1)-6).attr('width',w-m.r-sx(5000)).attr('height',sy(9.5)-sy(1)+6);
  ss.append('text').attr('class','zonelab').attr('x',w-m.r-6).attr('y',sy(1)+8).attr('text-anchor','end').text(t('sc.zone1'));
  ss.append('rect').attr('class','zone').attr('x',m.l).attr('y',sy(13.5)).attr('width',sx(400)-m.l).attr('height',sy(20)+6-sy(13.5));
  ss.append('text').attr('class','zonelab').attr('x',m.l+6).attr('y',sy(20)-2).text(t('sc.zone2'));
  ss.append('g').attr('class','axis').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(sx).tickValues([1,10,100,1000,10000]).tickFormat(v=>v===1?t('sc.same'):d3.format(',')(v)).tickSizeOuter(0));
  ss.append('text').attr('class','axt').attr('x',w-m.r).attr('y',h-8).attr('text-anchor','end').text(t('sc.x'));
  ss.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(sy).tickValues([1,5,10,15,20]).tickSizeOuter(0));
  ss.append('text').attr('class','axt').attr('x',2).attr('y',sy(1)+4).text(t('sc.close'));
  ss.append('text').attr('class','axt').attr('x',2).attr('y',sy(20)+4).text(t('sc.far'));
  const seen={};const pts=P.map(p=>{const key=Math.round(Math.log10(Math.max(1,p.km))*20)+'_'+p.f;const k=seen[key]=(seen[key]||0)+1;return{...p,jx:(k-1)%2?-Math.ceil((k-1)/2)*9:Math.ceil((k-1)/2)*9};});
  ss.append('g').selectAll('circle').data(pts).join('circle').attr('class',d=>'sdot '+d.cat).attr('cx',d=>sx(Math.max(1,d.km))+d.jx).attr('cy',d=>sy(d.f)).attr('r',5.5)
    .style('fill',d=>d.cat==='adm'?null:col(d.cat)).on('click',(e,d)=>{select(d.id);show('map');}).append('title').text(d=>`${d.n} · ${cityOf(d)} · ${d.f}/20`);
  ss.append('g').attr('class','slabs');sSel();
}
function sSel(){
  if(!sx)return;const hit=ss.selectAll('circle.sdot').classed('sel',d=>d.id===sel).attr('r',d=>d.id===sel?7.5:5.5).filter(d=>d.id===sel);
  if(hit.empty())return;hit.raise();const d=hit.datum();
  ss.select('.slabs').selectAll('text').data([d]).join('text').attr('class','slab').attr('x',sx(Math.max(1,d.km))+d.jx+11).attr('y',sy(d.f)+4).text(d.n);
}
function facts(){
  const a=P.filter(p=>p.km>5000&&p.f<=9).length,b=P.filter(p=>p.km<400&&p.f>=14).length;
  const la=P.filter(p=>['LA','글렌데일','윌셔','DTLA','발렌시아','롬폭'].includes(p.cityKey));const e=d3.extent(la,p=>p.f);
  document.getElementById('facts').innerHTML=LANG==='en'
    ?`<div><b>${a}</b><span>people over 5,000 km away who still feel close (9 or under)</span></div><div><b>${b}</b><span>people right here in Korea who feel far (14 or over)</span></div><div><b>${e[0]}–${e[1]}</b><span>the range of closeness among the ${la.length} people in and around LA</span></div>`
    :`<div><b>${a}명</b><span>5,000 km 넘게 떨어져 있지만 느끼는 거리 9 이하</span></div><div><b>${b}명</b><span>한국 안에 있지만 느끼는 거리 14 이상</span></div><div><b>${e[0]}–${e[1]}</b><span>LA 일대 ${la.length}명이 흩어진 느끼는 거리의 폭</span></div>`;
}

/* ---------- language + theme apply ---------- */
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh);el.setAttribute('aria-label',t(el.dataset.i18nPh));});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG));
  if(!timer)playBtn.textContent=t('tools.play');
  homeSheet(); facts(); renderChips();
  if(layoutName){const keep=[T1,T2,crop];buildPlate(layoutName);}
  card(); renderList(); applyYear();
  if(current==='about')scatter();
  setThemeBtn();
}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{if(LANG===b.dataset.lang)return;LANG=b.dataset.lang;store.set('fach-lang',LANG);applyLang();}));
const mq=matchMedia('(prefers-color-scheme: dark)');
let THEME=store.get('fach-theme');            // 'dark' | 'light' | null (follow the device)
function hostTheme(){const a=document.documentElement.getAttribute('data-theme');return a==='dark'||a==='light'?a:null;}
function isDark(){return THEME?THEME==='dark':(hostTheme()?hostTheme()==='dark':mq.matches);}
function applyTheme(){document.documentElement.classList.toggle('dark',isDark());setThemeBtn();
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=isDark()?'#0A0F22':'#EFE8D5';}
function setThemeBtn(){const b=document.getElementById('themeBtn'),d=isDark();
  b.setAttribute('aria-label',d?t('ui.theme.light'):t('ui.theme.dark'));b.title=b.getAttribute('aria-label');
  document.getElementById('themeIcon').innerHTML=d?'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/>':'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><circle cx="17.5" cy="5" r=".8"/><circle cx="20.5" cy="8.5" r=".6"/>';}
document.getElementById('themeBtn').addEventListener('click',()=>{THEME=isDark()?'light':'dark';store.set('fach-theme',THEME);applyTheme();});
try{mq.addEventListener('change',()=>{if(!THEME)applyTheme();});}catch(e){}
try{new MutationObserver(()=>{if(!THEME)applyTheme();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}

const VIEWS=['intro','map','people','home','about'];
let current=null;
function show(v){
  if(!VIEWS.includes(v))v='intro';
  current=v;
  VIEWS.forEach(k=>document.getElementById('v-'+k).hidden=k!==v);
  document.querySelectorAll('[data-go]').forEach(b=>{if(b.closest('.toptabs,.tabbar'))b.setAttribute('aria-current',b.dataset.go===v?'page':'false');});
  try{history.replaceState(null,'','#'+v);}catch(e){}
  if(v==='map')ensureLayout();
  if(v==='home')drawHomeChart();
  if(v==='about')scatter();
  if(v==='people')renderList();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)show(b.dataset.go);});
function ensureLayout(){const want=pickLayout();if(want!==layoutName)buildPlate(want);else applyCrop();setPeek();}
let rt;
new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{if(current==='map')ensureLayout();if(current==='home')drawHomeChart();if(current==='about')scatter();setPeek();},120);}).observe(document.querySelector('main'));
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==current)show(v);});
applyTheme(); applyLang(); select(sel);
show((location.hash||'#intro').slice(1));
</script>
